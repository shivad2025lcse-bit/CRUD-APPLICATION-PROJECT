<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <title>Food Details</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #fff7ed, #fef2f2);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            width: 460px;
            background: white;
            padding: 32px 28px;
            border-radius: 18px;
            box-shadow: 0 12px 28px rgba(15, 23, 42, 0.12);
        }
        h2 {
            text-align: center;
            margin-bottom: 25px;
            color: #1f2937;
        }
        form {
            display: flex;
            flex-direction: column;
            gap: 18px;
        }
        label {
            display: block;
            font-weight: bold;
            margin-bottom: 8px;
            color: #374151;
        }
        input, select, button {
            width: 100%;
            padding: 12px 14px;
            border-radius: 10px;
            border: 1px solid #d1d5db;
            font-size: 15px;
        }
        button {
            background: #0f766e;
            color: #ffffff;
            border: none;
            cursor: pointer;
            font-weight: bold;
        }
        button:hover {
            background: #15803d;
        }
        .link {
            text-align: center;
            margin-top: 18px;
        }
        .link a {
            color: #ef4444;
            text-decoration: none;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2 th:text="${food.id == null ? 'Add Indian Food Item' : 'Update Indian Food Item'}">Add Indian Food Item</h2>
        <form th:action="${formAction}" th:object="${food}" method="post">
            <div>
                <label for="foodName">Dish Name</label>
                <input type="text" id="foodName" th:field="*{foodName}" placeholder="e.g. Veg Biryani" required>
            </div>

            <div>
                <label for="category">Category</label>
                <select id="category" th:field="*{category}" required>
                    <option value="North Indian">North Indian</option>
                    <option value="South Indian">South Indian</option>
                    <option value="Biryani">Biryani</option>
                    <option value="Street Food">Street Food</option>
                    <option value="Breads">Breads</option>
                    <option value="Desserts">Desserts</option>
                    <option value="Beverages">Beverages</option>
                </select>
            </div>

            <div>
                <label for="description">Dish Description</label>
                <input type="text" id="description" th:field="*{description}" placeholder="Short description for customers" required>
            </div>

            <div>
                <label for="price">Price (₹)</label>
                <input type="number" id="price" th:field="*{price}" step="0.01" min="0" placeholder="e.g. 260" required>
            </div>

            <div>
                <label for="imageUrl">Image URL</label>
                <input type="url" id="imageUrl" th:field="*{imageUrl}" placeholder="Paste image URL here" required>
            </div>

            <div>
                <label for="vegetarian">Food Type</label>
                <select id="vegetarian" th:field="*{vegetarian}">
                    <option th:value="true">Vegetarian</option>
                    <option th:value="false">Non-vegetarian</option>
                </select>
            </div>

            <div>
                <label for="rating">Rating</label>
                <input type="number" id="rating" th:field="*{rating}" step="0.1" min="0" max="5" placeholder="e.g. 4.5">
            </div>

            <div>
                <label for="preparationMinutes">Preparation Time (minutes)</label>
                <input type="number" id="preparationMinutes" th:field="*{preparationMinutes}" min="1" placeholder="e.g. 25">
            </div>

            <div>
                <label for="isAvailable">Availability</label>
                <select id="isAvailable" th:field="*{isAvailable}">
                    <option th:value="true">Available</option>
                    <option th:value="false">Out of Stock</option>
                </select>
            </div>

            <button type="submit" th:text="${food.id == null ? 'Save Dish' : 'Update Dish'}">Save Dish</button>
        </form>
        <div class="link">
            <a th:href="@{/owner}">Back to owner view</a>
        </div>
    </div>
</body>
</html>
